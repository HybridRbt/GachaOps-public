[project]
name = "gachaops"
version = "0.1.0"
description = "Capability-based orchestration of existing game assistants"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
gachaops = "gachaops.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gachaops*"]
